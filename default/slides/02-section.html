<!-- @dsCard group="Slides" viewport="1280x720" name="Section Slide" subtitle="Big index numeral, φ-minor rail, loud section title." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="slides.css">
<style>
  .sec-content { display: grid; grid-template-columns: 1fr 1.618fr; gap: 0; padding: 0 !important; }
  .sec-num { border-right: 1px solid var(--border); display: flex; align-items: center; justify-content: center; position: relative; }
  .sec-num span { font-family: var(--font-display); font-weight: 900; font-size: 280px; color: var(--text-hot); line-height: 1; letter-spacing: -0.04em; }
  .sec-num .s-grid { opacity: .5; }
  .sec-body { padding: 56px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .sec-title { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: 72px; line-height: 0.88; letter-spacing: -0.025em; color: var(--text-hot); }
  .sec-title .hot { color: var(--accent); }
</style>
</head>
<body>
<div class="slide">
  <div class="slide-rail"><span class="g-sideways">SECTION · 02 / 05</span></div>
  <div class="slide-stage">
    <div class="slide-meta slide-meta--top">
      <span class="slide-mark"><span class="hot">G</span> / BASE</span>
      <span>SECTION</span>
    </div>
    <div class="slide-content sec-content">
      <div class="sec-num"><div class="s-grid"></div><span>02</span></div>
      <div class="sec-body">
        <span class="s-kicker">PART TWO</span>
        <h2 class="sec-title g-name">TYPE<br>&amp; GRID</h2>
        <p class="s-lead">Two monospaced families and a small lattice. Thick titles, quiet body, every edge on the line.</p>
      </div>
    </div>
    <div class="slide-meta slide-meta--bot">
      <span>SMALL GRIDS · GOLDEN RATIO</span>
      <span><b>●</b> 02 / 05</span>
    </div>
  </div>
  <div class="slide-rail slide-rail--r"><span class="g-sideways">φ 1.618 · MINIMAL MONO</span></div>
</div>
<script src="../assets/g-name.js"></script>
<script src="../assets/token-select.js"></script>
</body>
</html>
