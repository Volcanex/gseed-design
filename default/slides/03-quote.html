<!-- @dsCard group="Slides" viewport="1280x720" name="Big Quote Slide" subtitle="Oversized statement; key word in blue; attribution in mono." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="slides.css">
<style>
  .q-content { justify-content: center; gap: 40px; }
  .q-mark { font-family: var(--font-display); font-weight: 900; font-size: 120px; color: var(--accent); line-height: 0.6; height: 60px; }
  .q-text { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; font-size: 60px; line-height: 1.0; letter-spacing: -0.02em; color: var(--text); max-width: 22ch; }
  .q-text .hot { color: var(--accent); }
  .q-text .paper { color: var(--text-hot); }
  .q-by { display: flex; align-items: center; gap: 16px; }
  .q-rule { width: 64px; height: 2px; background: var(--accent); }
  .q-by span { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div class="slide">
  <div class="slide-rail"><span class="g-sideways">QUOTE · STATEMENT</span></div>
  <div class="slide-stage">
    <div class="slide-meta slide-meta--top">
      <span class="slide-mark"><span class="hot">G</span> / BASE</span>
      <span>03 · BIG QUOTE</span>
    </div>
    <div class="slide-content q-content">
      <div class="q-mark">“</div>
      <p class="q-text">Big <span class="hot">thick</span> font, then sideways small text on the <span class="paper">edges</span>.</p>
      <div class="q-by"><span class="q-rule"></span><span>THE BRIEF · G</span></div>
    </div>
    <div class="slide-meta slide-meta--bot">
      <span>BLACK IS THE BACKGROUND</span>
      <span><b>●</b> 03 / 05</span>
    </div>
  </div>
  <div class="slide-rail slide-rail--r"><span class="g-sideways">— STANDBY · φ</span></div>
</div>
<script src="../assets/token-select.js"></script>
</body>
</html>
