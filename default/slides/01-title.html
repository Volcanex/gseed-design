<!-- @dsCard group="Slides" viewport="1280x720" name="Title Slide" subtitle="Hero wordmark with the GABRIEL highlight over a small grid." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="slides.css">
<style>
  .title-stage .slide-content { justify-content: center; gap: 30px; position: relative; }
  .title-hero { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; letter-spacing: -0.03em; line-height: 0.82; font-size: 188px; position: relative; }
  .title-hero .cool { color: var(--text); }
  .title-hero .hot { color: var(--accent); }
  .title-row { display: flex; align-items: flex-end; justify-content: space-between; position: relative; }
  .title-sub { font: var(--text-lead); color: var(--text); max-width: 40ch; }
</style>
</head>
<body>
<div class="slide title-stage">
  <div class="slide-rail"><span class="g-sideways">SYSTEM DESIGN LANGUAGE BASE</span></div>
  <div class="slide-stage">
    <div class="slide-meta slide-meta--top">
      <span class="slide-mark"><span class="hot">G</span> / BASE</span>
      <span>v0.1 · φ 1.618</span>
    </div>
    <div class="slide-content">
      <div class="s-grid" style="opacity:.6"></div>
      <span class="s-kicker" style="position:relative">01 · TITLE</span>
      <div class="title-hero g-name">GABRIEL</div>
      <div class="title-row">
        <p class="title-sub">A monospaced, black-ground publishing system. Clean OS, crossed with a zine.</p>
        <span class="g-label" style="color:var(--accent)">▌ BEGIN</span>
      </div>
    </div>
    <div class="slide-meta slide-meta--bot">
      <span>RIGHT ANGLES · NO RADIUS</span>
      <span><b>●</b> 01 / 05</span>
    </div>
  </div>
  <div class="slide-rail slide-rail--r"><span class="g-sideways">φ · NO SIGNAL — STANDBY</span></div>
</div>
<script src="../assets/g-name.js"></script>
<script src="../assets/token-select.js"></script>
</body>
</html>
