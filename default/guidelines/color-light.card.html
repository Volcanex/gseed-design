<!-- @dsCard group="Colors" viewport="700x200" name="Light Mode — Ink on Paper" subtitle="Paper ground, ink text, the gabrielpenman azure as highlight." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  .card { padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); }
  .sw { background: var(--bg); padding: 18px 16px 14px; }
  .chip { width: 100%; height: 56px; border: 1px solid var(--border); }
  .meta { display: flex; justify-content: space-between; margin-top: 12px; }
  .name { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; color: var(--text-hot); font-size: 13px; letter-spacing: .04em; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing: .1em; }
  .role { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .14em; margin-top: 4px; }
</style>
</head>
<body data-theme="light">
  <div class="card">
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--g-paper)"></div><div class="meta"><span class="name">Paper</span></div><div class="hex">#FFFCFC</div><div class="role">Ground</div></div>
      <div class="sw"><div class="chip" style="background:var(--g-black)"></div><div class="meta"><span class="name">Ink</span></div><div class="hex">#131316</div><div class="role">Text · Heat</div></div>
      <div class="sw"><div class="chip" style="background:var(--g-blue-ink)"></div><div class="meta"><span class="name">Azure</span></div><div class="hex">#1A6FE6</div><div class="role">Highlight</div></div>
      <div class="sw"><div class="chip" style="background:var(--g-fill-2);border-color:var(--border-strong)"></div><div class="meta"><span class="name">Wash</span></div><div class="hex">α · INK</div><div class="role">Panel</div></div>
    </div>
  </div>
  <script src="../assets/token-select.js"></script>
</body>
</html>
