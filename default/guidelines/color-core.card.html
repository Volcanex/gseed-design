<!-- @dsCard group="Colors" viewport="700x190" name="Core Palette" subtitle="Four values. Black is the ground, grey reads, magenta & white hit." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); }
  .sw { background: var(--bg); padding: 18px 16px 14px; }
  .chip { width: 100%; height: 56px; border: 1px solid var(--border); }
  .meta { display: flex; justify-content: space-between; margin-top: 12px; }
  .name { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; color: var(--text-hot); font-size: 13px; letter-spacing: .04em; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing: .1em; }
  .role { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .14em; margin-top: 4px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--g-black)"></div><div class="meta"><span class="name">Black</span></div><div class="hex">#131316</div><div class="role">Ground</div></div>
    <div class="sw"><div class="chip" style="background:var(--g-grey)"></div><div class="meta"><span class="name">Grey</span></div><div class="hex">#E2DCDE</div><div class="role">Text</div></div>
    <div class="sw"><div class="chip" style="background:var(--g-blue)"></div><div class="meta"><span class="name">Magenta</span></div><div class="hex">#FF4FD8</div><div class="role">Highlight</div></div>
    <div class="sw"><div class="chip" style="background:var(--g-paper)"></div><div class="meta"><span class="name">Paper</span></div><div class="hex">#FFFCFC</div><div class="role">Heat</div></div>
  </div>
  <script src="../assets/token-select.js"></script>
</body>
</html>
