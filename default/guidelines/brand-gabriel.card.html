<!-- @dsCard group="Brand" viewport="700x230" name="The GABRIEL Highlight" subtitle="Letters G·A·B·R·I·E·L burn magenta. Every other glyph stays grey." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 28px 24px; display: flex; flex-direction: column; gap: 18px; }
  .word { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; letter-spacing: -.01em; line-height: .92; }
  .w-hero { font-size: 64px; }
  .w-line { font-size: 30px; }
  .cool { color: var(--text); }
  .hot { color: var(--accent); }
  .note { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; color: var(--text-faint); text-transform: uppercase; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; }
  .key { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; }
</style>
</head>
<body>
  <div class="word w-hero g-name">GABRIEL</div>
  <div class="word w-line g-name">GRID AND BASE</div>
  <div class="legend">
    <span class="key" style="color:var(--accent)">HOT → G A B R I E L</span>
    <span class="key" style="color:var(--text-faint)">/</span>
    <span class="key" style="color:var(--text)">COOL → EVERYTHING ELSE</span>
  </div>
  <span class="note">SIGNATURE · USE ON WORDMARKS &amp; HERO LINES ONLY</span>
  <script src="../assets/g-name.js"></script>
  <script src="../assets/token-select.js"></script>
</body>
</html>
