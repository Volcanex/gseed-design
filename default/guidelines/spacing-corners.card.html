<!-- @dsCard group="Spacing" viewport="700x180" name="Corners & Rules" subtitle="Radius is 0, always. Depth is hairlines — never shadow." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px; display: flex; gap: 18px; }
  .demo { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; color: var(--text-faint); text-transform: uppercase; }
  .box { height: 64px; background: var(--g-fill); }
  .b1 { border: 1px solid var(--border); }
  .b2 { border: 2px solid var(--border-strong); }
  .b3 { box-shadow: inset 0 0 0 1px var(--g-line); }
  .b4 { border: 1px solid var(--border-accent); }
  .val { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing: .06em; }
</style>
</head>
<body>
  <div class="demo"><span class="lbl">HAIRLINE 1PX</span><div class="box b1"></div><span class="val">--border</span></div>
  <div class="demo"><span class="lbl">ACTIVE 2PX</span><div class="box b2"></div><span class="val">--border-strong</span></div>
  <div class="demo"><span class="lbl">INSET RULE</span><div class="box b3"></div><span class="val">--inset-line</span></div>
  <div class="demo"><span class="lbl">FOCUS / ACCENT</span><div class="box b4"></div><span class="val">--border-accent · r0</span></div>
  <script src="../assets/token-select.js"></script>
</body>
</html>
