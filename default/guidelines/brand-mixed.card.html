<!-- @dsCard group="Brand" viewport="700x300" name="Light + Dark — Mixed Spread" subtitle="Bi-modal & mixable: a black spread beside a paper spread, zine-style." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  .spread { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--g-line-strong); border: 1px solid var(--g-line-strong); height: 300px; }
  .panel { position: relative; overflow: hidden; padding: 22px 22px 16px; display: flex; flex-direction: column; }
  .grid { position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image: linear-gradient(to right, var(--g-line) 1px, transparent 1px), linear-gradient(to bottom, var(--g-line) 1px, transparent 1px);
    background-size: 40px 40px; }
  .kick { position: relative; font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .word { position: relative; margin-top: auto; font-family: var(--font-display); font-weight: 900; font-size: 52px; text-transform: uppercase; letter-spacing: -.025em; line-height: .86; color: var(--text-hot); }
  .word b { color: var(--accent); font-weight: 900; }
  .meta { position: relative; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
  .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; padding: 4px 8px; border: 1px solid var(--border-accent); color: var(--accent); }
  .hx { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; color: var(--text-faint); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="spread">
    <div class="panel" data-theme="dark">
      <div class="grid"></div>
      <span class="kick">DARK · PAPER ON BLACK</span>
      <div class="word g-name">GRID<br>BLACK</div>
      <div class="meta"><span class="tag">● MAGENTA #FF4FD8</span><span class="hx">DEFAULT</span></div>
    </div>
    <div class="panel" data-theme="light">
      <div class="grid"></div>
      <span class="kick">LIGHT · INK ON PAPER</span>
      <div class="word g-name">GRID<br>PAPER</div>
      <div class="meta"><span class="tag">● AZURE #1A6FE6</span><span class="hx">SITE BLUE</span></div>
    </div>
  </div>
  <script src="../assets/g-name.js"></script>
  <script src="../assets/token-select.js"></script>
</body>
</html>
