<!-- @dsCard group="Spacing" viewport="700x230" name="Golden Split & Grid" subtitle="φ 1.618 primary division over a 64px small-grid module." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px; }
  .split { display: grid; grid-template-columns: 1.618fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); height: 170px; }
  .major, .minor { position: relative; }
  .major { background: var(--bg); }
  .minor { background: var(--bg); }
  .grid { position: absolute; inset: 0; background-image:
      linear-gradient(to right, var(--g-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--g-line) 1px, transparent 1px);
    background-size: 64px 64px; opacity: .9; }
  .tag { position: absolute; left: 12px; bottom: 10px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; color: var(--text-muted); text-transform: uppercase; }
  .phi { position: absolute; top: 12px; left: 12px; font-family: var(--font-display); font-weight: 900; font-size: 32px; color: var(--text-hot); }
  .edge { writing-mode: vertical-rl; position: absolute; right: 8px; top: 12px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .3em; color: var(--text-faint); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="split">
    <div class="major"><div class="grid"></div><span class="phi">φ</span><span class="tag">MAJOR · 1.618</span></div>
    <div class="minor"><div class="grid"></div><span class="tag">MINOR · 1.0</span><span class="edge">φ-MINOR RAIL</span></div>
  </div>
  <script src="../assets/token-select.js"></script>
</body>
</html>
