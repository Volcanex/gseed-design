<!-- @dsCard group="Spacing" viewport="700x170" name="8px Lattice" subtitle="All spacing rides an 8px lattice — 4 up to 128." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; color: var(--text-faint); text-transform: uppercase; margin-bottom: 16px; }
  .scale { display: flex; align-items: flex-end; gap: 14px; }
  .step { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .bar { background: var(--accent); height: 12px; }
  .n { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: .06em; }
</style>
</head>
<body>
  <div class="lbl">SPACE SCALE · S1 → S10</div>
  <div class="scale">
    <div class="step"><div class="bar" style="width:4px"></div><span class="n">4</span></div>
    <div class="step"><div class="bar" style="width:8px"></div><span class="n">8</span></div>
    <div class="step"><div class="bar" style="width:12px"></div><span class="n">12</span></div>
    <div class="step"><div class="bar" style="width:16px"></div><span class="n">16</span></div>
    <div class="step"><div class="bar" style="width:24px"></div><span class="n">24</span></div>
    <div class="step"><div class="bar" style="width:32px"></div><span class="n">32</span></div>
    <div class="step"><div class="bar" style="width:48px"></div><span class="n">48</span></div>
    <div class="step"><div class="bar" style="width:64px"></div><span class="n">64</span></div>
    <div class="step"><div class="bar" style="width:96px"></div><span class="n">96</span></div>
    <div class="step"><div class="bar" style="width:128px"></div><span class="n">128</span></div>
  </div>
  <script src="../assets/token-select.js"></script>
</body>
</html>
