<!-- loads styles.css + _ds_bundle.js from the design system root -->

</head>
<body>
<div id="root"></div>
<script src="seed.js"></script>
<script type="text/babel" src="Sidebar.jsx"></script>

<script type="text/babel" src="MinorZone.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
<script type="text/babel" data-presets="env,react">
  // ds-base.js appends the bundle asynchronously — wait for the namespace,
  // then alias it to window.GDS and mount.
  (function mount() {
    const ns = window.GDesignLanguage_267337;
    if (!ns || !window.App) { return void setTimeout(mount, 30); }
    window.GDS = ns;
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  })();
</script>
