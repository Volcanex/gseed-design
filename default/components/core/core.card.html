<!-- @dsCard group="Components" viewport="700x560" name="Core" subtitle="Buttons, tags, fields, toggle, status line, card, GABRIEL name." -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 24px; }
  .grid { display: flex; flex-direction: column; gap: 22px; }
  .block { display: flex; flex-direction: column; gap: 10px; }
  .cap { font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); border-bottom: 1px solid var(--border); padding-bottom: 7px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Tag, Field, Toggle, Card, StatusLine, GName, Sideways } = window.GDesignLanguage_267337;

function Demo() {
  const [q, setQ] = React.useState("");
  const [on, setOn] = React.useState(true);
  return (
    <div className="grid">
      <div className="block">
        <span className="cap">Buttons · primary / secondary / ghost · sizes · disabled</span>
        <div className="row">
          <Button variant="primary">RUN</Button>
          <Button variant="secondary" iconRight={"->"}>NEXT</Button>
          <Button variant="ghost">CANCEL</Button>
          <Button variant="primary" size="sm">SM</Button>
          <Button variant="secondary" size="lg">LG</Button>
          <Button variant="secondary" disabled>OFF</Button>
          <IconButton label="close">×</IconButton>
          <IconButton label="grid" active>▦</IconButton>
        </div>
      </div>

      <div className="block">
        <span className="cap">Tags · default / hot / solid</span>
        <div className="row">
          <Tag>SOURCE 03 / 12</Tag>
          <Tag tone="hot" dot>LIVE</Tag>
          <Tag tone="solid">φ-ALIGNED</Tag>
          <Tag dot>STANDBY</Tag>
        </div>
      </div>

      <div className="cols">
        <div className="block">
          <span className="cap">Field + Toggle</span>
          <Field label="Query" value={q} onChange={e => setQ(e.target.value)} placeholder="enter id" index="01" />
          <div className="row"><Toggle checked={on} onChange={setOn} label="Grid" /></div>
        </div>
        <div className="block">
          <span className="cap">Card</span>
          <Card label="Module" index="03 / 12">
            <p style={{font:"var(--text-body-f)",margin:0,fontSize:"13px"}}>Depth is the border. No shadow.</p>
          </Card>
        </div>
      </div>

      <div className="block">
        <span className="cap">Status line + cursor</span>
        <StatusLine items={[{label:"READY",hot:true,dot:true}, "SOURCE 03 / 12", "φ-ALIGNED"]} cursor />
      </div>

      <div className="block">
        <span className="cap">GName · the GABRIEL highlight</span>
        <GName as="div" style={{fontFamily:"var(--font-display)",fontWeight:900,fontSize:"40px",textTransform:"uppercase",letterSpacing:"-.01em"}}>GABRIEL</GName>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
